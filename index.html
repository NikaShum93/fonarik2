<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Фонарик Genially</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
    }

    #scene {
      position: relative;
      width: 1280px;
      height: 720px;
      margin: auto;
      background: transparent;
    }

    #darkness {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 720px;
      pointer-events: none;
      z-index: 999;
      background-color: rgba(0, 0, 0, 0.98);
      display: none;
      --x: 640px;
      --y: 360px;

      -webkit-mask-image: radial-gradient(circle 100px at var(--x) var(--y), transparent 0%, black 100%);
      -webkit-mask-repeat: no-repeat;
      mask-image: radial-gradient(circle 100px at var(--x) var(--y), transparent 0%, black 100%);
      mask-repeat: no-repeat;
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
    }

    #toggleButton {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border: 2px solid white;
      font-size: 16px;
      cursor: pointer;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div id="scene">
    <div id="darkness"></div>
    <button id="toggleButton">🔦ON</button>
  </div>

  <script>
    const darkness = document.getElementById("darkness");
    const button = document.getElementById("toggleButton");
    const container = document.getElementById("scene");
    let flashlightOn = false;

    container.addEventListener("mousemove", (e) => {
      if (!flashlightOn) return;
      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      darkness.style.setProperty('--x', `${x}px`);
      darkness.style.setProperty('--y', `${y}px`);
    });

    button.addEventListener("click", () => {
      flashlightOn = !flashlightOn;
      darkness.style.display = flashlightOn ? 'block' : 'none';
      button.textContent = flashlightOn ? "❌OFF" : "🔦ON";
    });
  </script>
</body>
</html>
